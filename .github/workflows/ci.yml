name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # OPA runs the Rego tests and the parity test between guard.rego and the built-in evaluator.
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - run: opa fmt --list --fail policy/
      - run: opa check --strict policy/
      - run: npm test
