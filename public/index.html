<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIM Swap Guard console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  /* Subscribers */
  .subs { flex: 1 1 320px; }
  .sub-row {
    display: flex; flex-direction: column; gap: 2px; width: 100%; min-height: 56px; padding: 10px 20px;
    text-align: left; border: 0; border-top: 1px solid var(--line); background: var(--paper);
  }
  .sub-row .num { font: 13px var(--mono); }
  .sub-row .what { font-size: 12px; color: var(--muted); }
  .sub-row[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .sub-row[aria-pressed="true"] .what { color: #BDBDBD; }
  .sub-custom { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .sub-custom input { height: 40px; padding: 0 10px; border: 1px solid var(--ink); font-family: var(--mono); }
  .subs-foot { margin: auto 0 0; padding: 20px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }

  /* Phone */
  .stage { flex: 0 1 460px; background: var(--sunk); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .phone {
    width: 340px; max-width: 100%; height: 690px; background: var(--paper); border: 10px solid var(--ink);
    border-radius: 44px; overflow: hidden; display: flex; flex-direction: column;
  }
  .phone-top { padding: 28px 24px 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .wordmark { font-weight: 700; font-size: 15px; letter-spacing: -0.02em; }
  .phone-body { flex-grow: 1; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 20px; }
  .tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); }
  .tabs button { height: 40px; padding: 0; border: 0; background: none; font-weight: 600; color: var(--faint); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .field { display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
  .field span:first-child { font-size: 12px; color: var(--muted); }
  .field input { border: 0; padding: 0; background: none; outline-offset: 4px; }
  .hello { font-size: 26px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; }
  .amount { font-size: 52px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button { height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #D4D4D4; background: var(--paper); font-size: 13px; font-weight: 500; }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .cta { margin-top: auto; height: 52px; border-radius: 26px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-weight: 600; font-size: 15px; }
  .cta.ghost { background: var(--paper); color: var(--ink); }
  .cta:disabled { opacity: 0.5; }
  .mark { width: 12px; height: 12px; border-radius: 999px; background: currentColor; }
  .phone-msg { font-size: 15px; color: #3D3D3D; }

  /* Server log */
  .server { flex: 1 1 480px; }
  .log { border-top: 1px solid var(--line); font: 12.5px/1.6 var(--mono); }
  .log-line { display: grid; grid-template-columns: 96px 18px minmax(0, 1fr); gap: 8px; padding: 6px 20px; border-bottom: 1px solid var(--line-soft); }
  .log-line .t, .log-line .d { color: var(--faint); }
  .log-line .x { overflow-wrap: anywhere; }
  .log-empty { padding: 14px 20px; color: var(--muted); }
  .verdict { margin-top: auto; padding: 28px 20px 24px; border-top: 1px solid var(--ink); display: flex; flex-direction: column; gap: 10px; }
  .verdict .big-result { font-size: 64px; }
  .verdict .why { font-size: 15px; max-width: 520px; }
  .verdict .meta { font: 12px var(--mono); color: var(--muted); }
  @media (max-width: 600px) { .phone { height: 620px; } .verdict .big-result { font-size: 48px; } }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">SIM Swap Guard</span>
  <nav class="nav" aria-label="Sections">
    <a href="/" aria-current="page">Console</a>
    <a href="/policy">Policy</a>
  </nav>
  <span class="status" id="policy-status"></span>
  <span class="status" id="operator"></span>
</header>

<main class="columns">
  <section class="col subs" aria-labelledby="subs-h">
    <div class="col-head"><h2 class="label" id="subs-h">Subscribers</h2></div>
    <div id="subs"></div>
    <p class="subs-foot">The bank only learns yes or no, or the date of the last SIM change. Nothing else leaves the network.</p>
  </section>

  <section class="stage" aria-label="Customer's phone">
    <div class="phone">
      <div class="phone-top">
        <span class="wordmark">ledgerline</span>
        <span class="mono muted" style="font-size: 11px" id="phone-num"></span>
      </div>
      <div class="phone-body" id="phone"></div>
    </div>
  </section>

  <section class="col server" aria-labelledby="log-h">
    <div class="col-head">
      <h2 class="label" id="log-h">Bank server</h2>
      <span class="note">The customer never sees this</span>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <div id="verdict"></div>
  </section>
</main>

<script type="module">
import { $, h, api, loadStatus, RESULT_LABEL, NEXT_STEP } from '/common.js';

const state = {
  numbers: [], phone: '', action: 'login', amount: 750,
  token: null, tokenFor: null, busy: false, outcome: null, error: null,
};

const CUSTOMER = {
  login: {
    allow: () => ['You are in', 'Balance £2,418.60'],
    step_up: () => ['Approve on your other device', 'Open Ledgerline on a device you have used before. We will not text you a code.'],
    review: () => ['We are checking this login', 'It usually takes a few minutes.'],
    block: () => ['We could not log you in', 'Something about this request does not look right. We have emailed you.'],
  },
  payment: {
    allow: (a) => ['Sent', `£${a} is on its way to Acme Ltd.`],
    step_up: (a) => ['Approve this payment', `Confirm £${a} with your passkey before it goes.`],
    review: () => ['Payment pending', 'We are checking this one. Usually a few minutes.'],
    block: () => ['We stopped this payment', 'Something about this request does not look right. We have emailed you.'],
  },
};

function renderSubs() {
  const rows = state.numbers.map((n) => h('button', {
    type: 'button', class: 'sub-row', 'aria-pressed': String(n.phoneNumber === state.phone),
    onclick: () => { select(n.phoneNumber); },
  }, h('span', { class: 'num' }, n.phoneNumber), h('span', { class: 'what' }, n.label)));
  const custom = h('label', { class: 'sub-custom' }, h('span', { class: 'note' }, 'Or any number'),
    h('input', {
      type: 'tel', placeholder: '+447700900001', value: state.numbers.some((n) => n.phoneNumber === state.phone) ? '' : state.phone,
      onchange: (e) => select(e.target.value.trim()),
    }));
  $('#subs').replaceChildren(...rows, custom);
}

function select(phone) {
  if (phone === state.phone) return;
  state.phone = phone;
  state.outcome = null;
  state.error = null;
  renderSubs();
  render();
}

function renderPhone() {
  $('#phone-num').textContent = state.phone;
  const isLogin = state.action === 'login';
  const out = state.outcome;

  if (out && !out.httpError) {
    const [title, msg] = CUSTOMER[state.action][out.decision](state.amount);
    const loggedIn = isLogin && out.token;
    $('#phone').replaceChildren(
      h('span', { class: `mark r-${out.decision}`, 'aria-hidden': 'true' }),
      h('div', { class: 'hello', role: 'status' }, title),
      h('div', { class: 'phone-msg' }, msg),
      loggedIn ? h('button', { type: 'button', class: 'cta', onclick: () => { state.action = 'payment'; state.outcome = null; render(); } }, 'Send money') : '',
      h('button', { type: 'button', class: `cta ghost`, style: loggedIn ? 'margin-top: 0' : '', onclick: () => { state.outcome = null; render(); } }, 'Try again'),
    );
    return;
  }

  const tabs = h('div', { class: 'tabs', role: 'tablist', 'aria-label': 'Action' },
    ['login', 'payment'].map((a) => h('button', {
      type: 'button', role: 'tab', 'aria-selected': String(state.action === a),
      onclick: () => { state.action = a; state.outcome = null; state.error = null; render(); },
    }, a === 'login' ? 'Log in' : 'Send money')));

  const hasSession = state.token && state.tokenFor === state.phone;
  let form;
  if (isLogin) {
    form = h('div', { style: 'display: flex; flex-direction: column; gap: 16px' },
      h('div', { class: 'hello' }, 'Welcome back'),
      h('label', { class: 'field' }, h('span', {}, 'Mobile number'), h('span', { class: 'mono' }, state.phone || '—')),
      h('label', { class: 'field' }, h('span', {}, 'Password'), h('input', { id: 'pw', type: 'password', value: 'demo', autocomplete: 'off' })));
  } else {
    form = h('div', { style: 'display: flex; flex-direction: column; gap: 16px' },
      h('span', { class: 'muted', style: 'font-size: 13px' }, 'To Acme Ltd'),
      h('div', { class: 'amount' }, `£${state.amount}`),
      h('div', { class: 'chips', role: 'group', 'aria-label': 'Amount' }, [200, 750, 2500].map((v) => h('button', {
        type: 'button', 'aria-pressed': String(v === state.amount), onclick: () => { state.amount = v; render(); },
      }, `£${v}`))),
      hasSession ? null : h('span', { class: 'note' }, 'Log in first: payments need a session.'));
  }

  const ready = state.phone && (isLogin || hasSession);
  const label = state.busy ? 'Checking…' : isLogin ? 'Log in' : hasSession ? `Send £${state.amount}` : 'Log in first';
  $('#phone').replaceChildren(tabs, form,
    state.error ? h('div', { class: 'error-text', role: 'alert' }, state.error) : '',
    h('button', {
      type: 'button', class: 'cta', disabled: state.busy || !state.phone,
      onclick: ready ? run : () => { state.action = 'login'; render(); },
    }, label));
}

const pad = (n, w = 2) => String(n).padStart(w, '0');
const clock = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`; };

function compact(json) {
  try { return JSON.stringify(JSON.parse(json)); } catch { return json; }
}

function logLines(out) {
  const t0 = out.startedAt;
  const lines = [{ at: 0, dir: '·', text: state.action === 'login' ? `login ${state.phone}` : `payment £${state.amount} ${state.phone}` }];
  for (const e of out.trace ?? []) {
    if (e.kind === 'http') {
      const req = e.request ? `  ${compact(e.request)}` : '';
      lines.push({ at: e.at, dir: '→', text: `${e.method} ${e.url}${e.label === 'operator' ? req : ''}` });
      const back = e.error ? `failed: ${e.error}`
        : e.label === 'token' ? `${e.status}  token issued (not shown)`
        : e.label === 'operator' ? `${e.status}  ${compact(e.response ?? '')}`
        : `${e.status}`;
      const tone = !e.status || e.status >= 500 ? 'r-block' : e.label === 'operator' && /"swapped":true/.test(e.response ?? '') ? 'r-step_up' : e.status === 200 ? 'r-allow' : 'r-block';
      lines.push({ at: e.at + (e.ms ?? 0), dir: '←', text: `${back}  ${e.ms ?? 0}ms`, tone });
    } else if (e.kind === 'policy') {
      lines.push({ at: e.at, dir: '·', text: `policy ${e.text}`, tone: e.text.startsWith('OPA failed') ? 'r-block' : '' });
    } else if (e.kind === 'decision') {
      lines.push({ at: e.at, dir: '·', text: `decision ${e.text}`, tone: `r-${out.decision}` });
    }
  }
  return lines.map((l) => h('div', { class: 'log-line' },
    h('span', { class: 't' }, clock(t0 + l.at)), h('span', { class: 'd' }, l.dir), h('span', { class: `x ${l.tone ?? ''}` }, l.text)));
}

function renderServer() {
  const out = state.outcome;
  if (!out) {
    $('#log').replaceChildren(h('div', { class: 'log-empty' }, state.busy ? 'Checking…' : `Waiting for the customer to ${state.action === 'login' ? 'log in' : 'send money'}…`));
    $('#verdict').replaceChildren();
    return;
  }
  if (out.httpError) {
    $('#log').replaceChildren(h('div', { class: 'log-empty error-text' }, out.httpError));
    $('#verdict').replaceChildren();
    return;
  }
  $('#log').replaceChildren(...logLines(out));
  const s = out.structured;
  $('#verdict').replaceChildren(h('div', { class: 'verdict' },
    h('span', { class: 'label' }, 'Decision'),
    h('span', { class: `big-result r-${s.result}` }, RESULT_LABEL[s.result]),
    h('span', { class: 'why' }, s.reason),
    h('span', { class: 'note', style: 'font-size: 13px; max-width: 520px' }, NEXT_STEP[s.result]),
    h('span', { class: 'meta' }, `rule ${s.rule} · window ${s.window_hours}h${s.obligations.length ? ` · ${s.obligations.join(', ')}` : ''}`)));
}

function render() { renderPhone(); renderServer(); }

async function run() {
  state.busy = true; state.error = null; state.outcome = null;
  render();
  const startedAt = Date.now();
  let res;
  if (state.action === 'login') {
    res = await api('/api/login', { method: 'POST', body: { phoneNumber: state.phone, password: $('#pw')?.value ?? '' } });
    if (res.data.token) { state.token = res.data.token; state.tokenFor = state.phone; }
  } else {
    res = await api('/api/pay', { method: 'POST', body: { amount: state.amount, payee: 'Acme Ltd' }, headers: { authorization: `Bearer ${state.token}` } });
    if (res.status === 401) { state.token = null; }
  }
  state.busy = false;
  if (res.data.decision) state.outcome = { ...res.data, startedAt };
  else state.error = res.data.error ?? 'Something went wrong.';
  render();
}

const [{ data: numbers }] = await Promise.all([api('/api/demo-numbers'), loadStatus()]);
state.numbers = Array.isArray(numbers) ? numbers : [];
state.phone = state.numbers[1]?.phoneNumber ?? state.numbers[0]?.phoneNumber ?? '';
renderSubs();
render();
</script>
</body>
</html>
